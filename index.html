<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0b14"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Arena de Ki Online</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0b14;--fg:#efeaff;--muted:#8d86a8;--panel:#1a1528;--line:#3a2e58;--acc:#ffd23a;--acc2:#ff8a2a}
  *{box-sizing:border-box}
  /* nada na página pode ser selecionado, arrastado ou ampliado (só os campos de texto) */
  *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-user-drag:none}
  input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
  html,body{margin:0;position:fixed;inset:0;width:100%;height:100%;background-color:#0d0b14;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:var(--bg);color:var(--fg);font-family:"Press Start 2P",monospace;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  /* o jogo ocupa a tela inteira, em qualquer formato */
  #wrap{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;--u:1px}
  canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  /* ÁREA PROTEGIDA: HUD, textos e botões ficam só aqui dentro, longe das bordas e do entalhe da tela */
  #safe{position:absolute;pointer-events:none;--px:max(16px,2.6vw);--py:max(12px,2.8vh);
    left:calc(env(safe-area-inset-left) + var(--px));right:calc(env(safe-area-inset-right) + var(--px));
    top:calc(env(safe-area-inset-top) + var(--py));bottom:calc(env(safe-area-inset-bottom) + var(--py))}
  @media (pointer:coarse){#safe{--px:max(26px,5.2vw);--py:max(16px,4.8vh)}}
  /* controles de toque */
  #touch{position:absolute;inset:0;pointer-events:none}
  #touch.hidden{display:none}
  #touch button{position:absolute;pointer-events:auto;touch-action:none;font-family:inherit;color:#fff;border:2px solid rgba(255,255,255,.55);background:rgba(20,14,36,.3);border-radius:50%;
    line-height:1.1;padding:0;text-shadow:0 1px 0 #000;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}
  #touch button:hover{background:rgba(60,44,100,.45)}
  #touch button.on{background:rgba(255,210,58,.5);border-color:#ffe680}
  #touch button.stick{background:rgba(20,14,36,.25);border-width:3px}
  #touch button.stick.on{background:rgba(20,14,36,.35);border-color:#ffe680}
  #touch button.stick .knob{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;background:rgba(255,255,255,.4);border:2px solid rgba(255,255,255,.85);pointer-events:none;transition:transform .06s}
  #touch button.sm{border-radius:18%}
  #touch.edit button{border:2px dashed rgba(255,255,255,.8);cursor:move}
  #touch.edit button.sel{border-color:#ffd23a;background:rgba(255,210,58,.35);box-shadow:0 0 0 3px rgba(255,210,58,.35)}
  /* barrinha da edição: pequena e sempre num lugar sem botão embaixo */
  /* chat: barra de digitar no topo, pequena; as mensagens aparecem discretas no canto esquerdo */
  #chatbar{position:absolute;left:50%;top:0;transform:translateX(-50%);width:min(56%,460px);pointer-events:auto;display:flex;gap:5px;background:rgba(18,12,28,.88);border:2px solid var(--line);box-shadow:0 0 0 2px #000;padding:4px}
  #chatbar.hidden{display:none}
  #chatbar input{flex:1;min-width:0;font-size:16px;padding:5px 7px}
  #chatbar button.b{padding:6px 8px;font-size:9px;min-width:54px}
  #chatbar button.b.wait{background:#3a3450;color:#9d94bd}
  #editbar{position:absolute;pointer-events:auto;background:rgba(26,21,40,.92);border:2px solid var(--line);box-shadow:0 0 0 2px #000;padding:5px;display:flex;gap:5px;align-items:center;white-space:nowrap}
  #editbar.hidden{display:none}
  #editbar button.b{padding:7px 9px;font-size:9px}
  #selName{font-size:8px;color:var(--acc);min-width:84px;text-align:center}
  /* celular em pé: o jogo inteiro é girado 90° e continua na horizontal (sem aviso) */
  #wrap.rot{inset:auto;left:0;top:0;transform-origin:0 0}
  #wrap.rot #safe{left:calc(env(safe-area-inset-top) + var(--px));right:calc(env(safe-area-inset-bottom) + var(--px));
    top:calc(env(safe-area-inset-right) + var(--py));bottom:calc(env(safe-area-inset-left) + var(--py))}
  /* menus (telas por cima do jogo) */
  .ovl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,12,40,.55),rgba(8,5,16,.85));
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .ovl.hidden{display:none}
  .card.small{width:min(90%,420px)}
  .one{grid-template-columns:1fr}
  .set{display:flex;flex-direction:column;gap:8px}
  .set label{display:flex;justify-content:space-between;font-size:clamp(8px,1vw,10px);color:var(--fg)}
  .set label span{color:var(--acc)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;touch-action:pan-x}
  input[type=range]::-webkit-slider-runnable-track{height:8px;background:#0f0b19;border:2px solid var(--line)}
  input[type=range]::-moz-range-track{height:8px;background:#0f0b19;border:2px solid var(--line)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;background:var(--acc);border:2px solid #000}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;background:var(--acc);border:2px solid #000;border-radius:0}
  button.room.full{opacity:.55;cursor:not-allowed}
  button.room.full .rj{background:#555;box-shadow:0 0 0 2px #888}
  .card{max-height:96%;overflow:auto;touch-action:pan-y;width:min(94%,900px);background:rgba(26,21,40,.94);border:3px solid var(--line);box-shadow:0 0 0 3px #000,0 12px 40px #000;padding:clamp(12px,2.4vw,26px);display:flex;flex-direction:column;gap:clamp(8px,1.4vw,14px)}
  .title{text-align:center;line-height:1.25}
  .title b{display:block;font-size:clamp(18px,3.4vw,34px);color:var(--acc);text-shadow:3px 3px 0 #3a1206}
  .title small{display:block;margin-top:6px;font-size:clamp(7px,.9vw,9px);color:var(--muted)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .row label{font-size:clamp(7px,.9vw,9px);color:var(--muted);min-width:70px}
  #chars{display:flex;gap:8px;flex:1;flex-wrap:wrap}
  button.char{flex:1;min-width:84px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;font-family:inherit;font-size:clamp(7px,.85vw,9px);color:var(--fg);background:#0f0b19;border:2px solid var(--line);cursor:pointer}
  button.char canvas{width:64px;height:64px;image-rendering:pixelated;image-rendering:crisp-edges;background:transparent}
  button.char:hover{background:#221a36}
  #maps{display:flex;gap:8px;flex:1;flex-wrap:wrap}
  #lookRow.hidden{display:none}
  .cust{width:min(96%,980px)}
  .ctitle{margin:0 0 10px;text-align:center;color:var(--acc);font-size:clamp(12px,2vw,20px)}
  .cwrap{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap}
  .cprev{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;background:#0f0b19;border:2px solid var(--line);padding:8px}
  .cprev canvas{width:320px;height:280px;max-width:100%;object-fit:contain;image-rendering:pixelated;background:radial-gradient(ellipse at 50% 85%,#3a3060,#141024 70%)}
  .cname{font-size:clamp(8px,1vw,11px);color:var(--acc)}
  .cposes{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
  .cposes button{font-family:inherit;font-size:clamp(6px,.75vw,8px);padding:4px 6px;background:#1a1430;color:var(--fg);border:1px solid var(--line);cursor:pointer}
  .cposes button.sel{border-color:var(--acc);color:var(--acc)}
  .copts{flex:1;min-width:260px;display:flex;flex-direction:column;gap:8px}
  .ctabs{display:flex;gap:4px;flex-wrap:wrap}
  .ctabs button{flex:1;font-family:inherit;font-size:clamp(7px,.9vw,10px);padding:8px 4px;background:#1a1430;color:var(--fg);border:2px solid var(--line);cursor:pointer}
  .ctabs button.sel{background:#2b2244;border-color:var(--acc);color:var(--acc)}
  .ctabs button:disabled{opacity:.35;cursor:default}
  .cpanel{background:#0f0b19;border:2px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:10px;min-height:180px}
  .cpanel h4{margin:0;font-size:clamp(7px,.85vw,9px);color:#cfc6ff;font-weight:normal}
  .cgrid{display:flex;gap:8px;flex-wrap:wrap}
  .copt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 6px;font-family:inherit;font-size:clamp(6px,.8vw,8px);color:var(--fg);background:#1a1430;border:2px solid var(--line);cursor:pointer}
  .copt canvas{width:56px;height:56px;image-rendering:pixelated}
  .copt.sel{border-color:var(--acc);background:#2b2244;color:var(--acc)}
  .cswatch{display:flex;gap:6px;flex-wrap:wrap}
  .cswatch button{width:26px;height:26px;border-radius:50%;border:2px solid #0f0b19;box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0;font-family:inherit;font-size:8px;color:#fff}
  .cswatch button.sel{box-shadow:0 0 0 3px var(--acc)}
  .cswatch .more{width:26px;height:26px;border-radius:50%;border:2px solid #0f0b19;box-shadow:0 0 0 2px var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;text-shadow:0 0 3px #000;background:conic-gradient(#ff3b3b,#ffd23a,#3ccf6a,#5cd6ff,#3f7bff,#b06bff,#ff3b3b);position:relative}
  .cswatch .more input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
  .cswatch button.mine{border-style:dashed;border-color:#fff}
  .cswatch button.def{background:repeating-linear-gradient(45deg,#2b2244 0 4px,#4a3d70 4px 8px)}
  .cnote{font-size:clamp(7px,.8vw,9px);color:#9d93c9;line-height:1.5}
  .cbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
  #fxcols{display:flex;flex-direction:column;gap:6px;flex:1}
  #fxcols .fxl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  #fxcols .fxl>span{font-size:clamp(7px,.8vw,8px);min-width:44px;color:var(--fg)}
  #fxcols .fxl>div{display:flex;gap:5px;flex-wrap:wrap}
  button.hcol.def{background:repeating-linear-gradient(45deg,#2b2244 0 4px,#4a3d70 4px 8px)!important;color:#fff;font-size:8px;font-family:inherit}
  #looks{display:flex;flex-direction:column;gap:6px;flex:1}
  #hairs{display:flex;gap:6px;flex-wrap:wrap}
  #hcols{display:flex;gap:5px;flex-wrap:wrap}
  #tails{display:flex;gap:6px;flex-wrap:wrap}
  button.hairb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 6px;font-family:inherit;font-size:clamp(7px,.8vw,8px);color:var(--fg);background:#0f0b19;border:2px solid var(--line);cursor:pointer}
  button.hairb canvas{width:40px;height:40px;image-rendering:pixelated}
  button.hairb.sel{border-color:var(--acc);background:#2b2244;color:var(--acc)}
  button.hcol{width:22px;height:22px;border-radius:50%;border:2px solid #0f0b19;cursor:pointer;padding:0;box-shadow:0 0 0 2px var(--line)}
  button.hcol.sel{box-shadow:0 0 0 3px var(--acc)}
  button.mapb{flex:1;min-width:84px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px;font-family:inherit;font-size:clamp(7px,.85vw,9px);color:var(--fg);background:#0f0b19;border:2px solid var(--line);cursor:pointer}
  button.mapb canvas{width:100%;max-width:120px;aspect-ratio:16/9;image-rendering:pixelated;background:#000}
  button.mapb:hover{background:#221a36}
  button.mapb.sel{border-color:var(--acc);background:#2b2244;box-shadow:0 0 0 2px rgba(255,210,58,.35);color:var(--acc)}
  button.char.sel{border-color:var(--acc);background:#2b2244;box-shadow:0 0 0 2px rgba(255,210,58,.35);color:var(--acc)}
  /* 16px evita o zoom automático do iPhone ao tocar no campo */
  input[type=text]{flex:1;min-width:0;background:#0f0b19;border:2px solid var(--line);color:var(--fg);font-family:inherit;font-size:16px;padding:7px 8px;outline:none;border-radius:0}
  input[type=text]:focus{border-color:var(--acc)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,2vw,22px)}
  @media (max-width:560px){.cols{grid-template-columns:1fr}}
  .col{display:flex;flex-direction:column;gap:10px;min-width:0}
  .lh{display:flex;justify-content:space-between;align-items:center;font-size:clamp(8px,1vw,10px);color:var(--acc)}
  #lobbyState{font-size:clamp(6px,.75vw,8px);color:var(--muted)}
  #lobbyState.ok{color:#7dff6a}
  #onlineInfo{font-size:clamp(7px,.85vw,9px);color:#cfc6ff;line-height:1.6}
  #onlineInfo b{color:#7dff6a}
  button.room .cnt{grid-row:1/3;grid-column:2;align-self:center;font-size:clamp(9px,1.1vw,12px);color:#7dff6a;text-align:right}
  button.room.full .cnt{color:#ff6a5a}
  #rooms{display:flex;flex-direction:column;gap:6px;min-height:110px;max-height:min(42vh,260px);overflow:auto;touch-action:pan-y;background:#0f0b19;border:2px solid var(--line);padding:6px}
  #rooms .empty{margin:auto;text-align:center;font-size:clamp(7px,.85vw,9px);color:var(--muted);line-height:1.9}
  button.room{display:grid;grid-template-columns:1fr auto auto;grid-template-rows:auto auto;gap:4px 8px;text-align:left;font-family:inherit;background:#2b2244;color:var(--fg);border:2px solid #000;box-shadow:0 0 0 2px var(--line);padding:8px;cursor:pointer}
  button.room:hover{background:#3a2e5c}
  button.room .rn{font-size:clamp(8px,1vw,10px);color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  button.room .rc{font-size:clamp(6px,.75vw,8px);color:var(--muted)}
  button.room .rj{grid-row:1/3;grid-column:3;align-self:center;font-size:clamp(7px,.9vw,9px);background:#c4661b;padding:6px 8px;box-shadow:0 0 0 2px #ffb15a}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btns .wide{grid-column:1/3}
  button.b{font-family:inherit;font-size:clamp(8px,1vw,10px);padding:12px 8px;background:#2b2244;color:var(--fg);border:2px solid #000;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),0 0 0 2px var(--line);cursor:pointer}
  button.b:hover{background:#3a2e5c}
  button.b.pri{background:#c4661b;box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),0 0 0 2px #ffb15a}
  button.b.pri:hover{background:#dc7a26}
  #status{min-height:14px;font-size:clamp(7px,.9vw,9px);color:#ffd8a8;text-align:center;line-height:1.6}
  .hint{font-size:clamp(6px,.8vw,8px);color:var(--muted);text-align:center;line-height:1.7}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="480" height="270"></canvas>
  <div id="menu" class="ovl">
    <div class="card">
      <div class="title"><b>ARENA DE KI</b><small>batalha livre online · jogo de estudo</small></div>
      <div class="cols">
        <div class="col">
          <div class="row"><label>NOME</label><input id="name" type="text" maxlength="12" placeholder="seu nome" autocomplete="off" autocorrect="off" spellcheck="false"></div>
          <div class="row" style="align-items:stretch"><label style="align-self:center">PERSONAGEM</label><div id="chars"></div></div>
          <div class="row"><label>VISUAL</label><button class="b pri" id="bCustom" style="flex:1">✎ PERSONALIZAR</button></div>
          <div class="row" style="align-items:stretch"><label style="align-self:center">MAPA</label><div id="maps"></div></div>
          <div class="btns">
            <button class="b" id="bTrain">MODO TREINO</button>
            <button class="b" id="bBots">CONTRA BOTS</button>
            <button class="b pri wide" id="bHost">CRIAR SALA ONLINE</button>
            <button class="b wide" id="bSettings">⚙ CONFIGURAÇÕES</button>
          </div>
          <div class="row" style="gap:6px;flex-wrap:nowrap"><input id="code" type="text" maxlength="4" placeholder="CÓDIGO" autocomplete="off" autocorrect="off" spellcheck="false" style="text-transform:uppercase"><button class="b" id="bJoin">ENTRAR</button></div>
        </div>
        <div class="col">
          <div class="lh"><span>SALAS ABERTAS</span><span id="lobbyState">conectando...</span></div>
          <div id="onlineInfo">Cada sala tem até 6 jogadores.</div>
          <div id="rooms"><div class="empty">Procurando salas...</div></div>
        </div>
      </div>
      <div id="status"></div>
    </div>
  </div>
  <div id="safe">
    <div id="touch" class="hidden"></div>
    <div id="chatbar" class="hidden"><input id="chatIn" type="text" maxlength="60" placeholder="Mensagem para a sala..." autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="send"><button class="b pri" id="chatSend">ENVIAR</button><button class="b" id="chatX">✕</button></div>
    <div id="editbar" class="hidden">
      <button class="b" id="eMinus">−</button><span id="selName">ARRASTE</span><button class="b" id="ePlus">+</button>
      <button class="b" id="eReset">PADRÃO</button><button class="b pri" id="eDone">OK</button>
    </div>
  </div>
  <div id="pause" class="ovl hidden">
    <div class="card small">
      <div class="title"><b>PAUSA</b><small id="pauseInfo"></small></div>
      <div class="btns one">
        <button class="b pri" id="pContinue">CONTINUAR</button>
        <button class="b" id="pSettings">⚙ CONFIGURAÇÕES</button>
        <button class="b" id="pExit">SAIR DA PARTIDA</button>
      </div>
    </div>
  </div>
  <div id="custom" class="ovl hidden">
    <div class="card cust">
      <h2 class="ctitle">PERSONALIZAR</h2>
      <div class="cwrap">
        <div class="cprev">
          <canvas id="cPrev" width="80" height="70"></canvas>
          <div class="cname" id="cName"></div>
          <div class="cposes" id="cPoses"></div>
        </div>
        <div class="copts">
          <div class="ctabs" id="cTabs"></div>
          <div class="cpanel" id="cPanel"></div>
        </div>
      </div>
      <div class="cbtns"><button class="b" id="cRand">🎲 ALEATÓRIO</button><button class="b pri" id="cDone">✓ PRONTO</button></div>
    </div>
  </div>
  <div id="settings" class="ovl hidden">
    <div class="card small">
      <div class="title"><b>CONFIGURAÇÕES</b><small>botões na tela</small></div>
      <div class="set"><label>Tamanho dos botões <span id="vSize"></span></label><input type="range" id="rSize" min="60" max="170" step="5"></div>
      <div class="set"><label>Visibilidade dos botões <span id="vOp"></span></label><input type="range" id="rOp" min="25" max="100" step="5"></div>
      <div class="btns one">
        <button class="b" id="bEdit">POSICIONAR BOTÕES</button>
        <button class="b" id="bReset">RESTAURAR PADRÃO</button>
        <button class="b pri" id="bBack">VOLTAR</button>
      </div>
    </div>

/* ---------------- entrada ---------------- */
const keys = {}, pressed = {};
const BLOCKED = ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
addEventListener('keydown', e => {
  initAudio(); if (actx && actx.state === 'suspended') actx.resume();
  if (e.code === 'Escape') { onEscape(); return; }
  if (chatOpen) return; // digitando: o teclado é do chat
  if ((e.code === 'Enter' || e.code === 'NumpadEnter') && game.phase === 'play' && game.mode === 'online' && !overlay) { e.preventDefault(); openChat(); return; }
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  if (BLOCKED.includes(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const held = (...c) => c.some(k => keys[k]);
const tap = (...c) => c.some(k => pressed[k]);
const emptyInput = () => ({ left: 0, right: 0, down: 0, up: 0, upP: 0, punchP: 0, kiP: 0, bigP: 0, beam: 0, beamP: 0, charge: 0, chargeP: 0, dashP: 0, face: 0 });

    left: held('KeyA', 'ArrowLeft'), right: held('KeyD', 'ArrowRight'),
    down: held('KeyS', 'ArrowDown'), up: held('KeyW', 'ArrowUp'), upP: tap('KeyW', 'ArrowUp'),
    punchP: tap('KeyJ'), kiP: tap('KeyK'), bigP: tap('KeyL'),

/* ---------------- efeitos ---------------- */

  for (let i = 0; i < n; i++) { const a = rnd(0, Math.PI * 2), v = rnd(speed * 0.3, speed);

function dust(x, y, n, dir = 0) {

/* ---------------- bots ---------------- */
class Bot {
  constructor(me, mode) { this.me = me; this.mode = mode; this.t = 0; this.plan = emptyInput(); this.hold = 0; this.wander = 0; this.beamHold = 0; }
  target() {
    let best = null, bd = 1e9;
    for (const f of game.fighters) if (f !== this.me && !f.dead) { const d = Math.hypot(f.x - this.me.x, (f.y - this.me.y) * 1.5); if (d < bd) { bd = d; best = f; } }
    return best;
  }
  think(dt) {
    const me = this.me; const out = emptyInput();
    if (me.dead) return out;
    // ---- boneco de treino: saco de pancada. Não anda, não pula, não defende, não ataca. ----
    if (this.mode === 'dummy') { if (game.me && !game.me.dead) out.face = sign(game.me.x - me.x); return out; }
    // ---- bot de combate ----
    const tg = this.target(); if (!tg) return out;
    const dx = tg.x - me.x, adx = Math.abs(dx), dy = tg.y - me.y, dir = sign(dx);
    if (this.beamHold > 0) { this.beamHold -= dt; out.beam = 1; out.face = dir; return out; }
    // desviar de projéteis
    for (const p of projectiles) {
      if (p.o === me.id || p.dead) continue;
      if (sign(me.x - p.x) === sign(p.vx) && Math.abs(me.x - p.x) < 100 && Math.abs(p.y - (me.y - 22)) < 30 && Math.random() < 0.08) {
        if (me.ki > 15 && Math.random() < 0.5) { out.dashP = 1; out.left = dir > 0; out.right = dir < 0; return out; }
        if (me.onGround) { out.upP = 1; return out; }
      }
    }
    this.t -= dt; this.hold -= dt;
    if (this.hold > 0) return { ...this.plan, upP: 0, punchP: 0, kiP: 0, bigP: 0, dashP: 0 };
    if (this.t > 0) { const o = { ...this.plan }; o.upP = 0; o.punchP = 0; o.kiP = 0; o.bigP = 0; o.dashP = 0;
      // continuar voando para alcançar alvo acima
      o.up = (dy < -20 && me.ki > 12) ? 1 : 0; // segura o pulo para voar até o alvo
      if (o.up && !me.onGround && !me.flying && me.vy > -120) o.upP = 1; // aperta de novo no ar
      return o; }
    this.t = rnd(0.15, 0.3);
    const plan = emptyInput();
    if (me.ki < 25 && adx > 150) { plan.charge = 1; this.plan = plan; this.hold = rnd(2, 3.5); return plan; }
    if (dy < -50 && me.onGround) { out.upP = 1; plan.up = 1; }
    else if (dy < -25 && me.ki > 15) plan.up = 1;
    if (adx > 80) {
      const r = Math.random();
      if (Math.abs(dy) < 30 && me.ki >= 45 && r < 0.08) { this.beamHold = rnd(0.9, 1.6); out.beam = 1; out.beamP = 1; out.face = dir; this.plan = emptyInput(); return out; }
      if (Math.abs(dy) < 30 && me.ki >= 40 && r < 0.16) { out.bigP = 1; out.face = dir; }
      else if (Math.abs(dy) < 34 && me.ki >= 10 && r < 0.45) { out.kiP = 1; out.face = dir; }
      else { if (dir > 0) plan.right = 1; else plan.left = 1; if (adx > 240 && me.ki > 30 && Math.random() < 0.2) out.dashP = 1; }
    } else if (adx > 26) { if (dir > 0) plan.right = 1; else plan.left = 1; if (Math.random() < 0.4) out.punchP = 1; }

      if (Math.abs(dy) < 34) { out.punchP = 1; out.face = dir; }

    }
    if (dy > 40 && !me.onGround) plan.down = 1;

    return { ...plan, ...Object.fromEntries(Object.entries(out).filter(([k, v]) => v)) };
  }
}

/* ---------------- cenário ---------------- */
let BG = null;

    m.fillStyle = '#d58d5e'; m.fillRect(x0 + 12, top, w - 22, 4);

    m.fillStyle = '#8a4f33'; m.fillRect(x0 + w - 8, top + 10, 4, mh - top);

  if (M.mid === 'namek') while (mx < mw) { // árvores de Namekusei: tronco fino e copa redonda

    m.fillStyle = '#5b7f6a'; m.fillRect(x0 - 2, top, 4, mh - top);
    m.fillStyle = '#2f8f5a'; m.beginPath(); m.arc(x0, top, r, 0, Math.PI * 2); m.fill();
    m.fillStyle = '#4fbf6a'; m.beginPath(); m.arc(x0 - r * 0.3, top - r * 0.3, r * 0.6, 0, Math.PI * 2); m.fill();
    if (R() < 0.5) { m.fillStyle = '#6a8fa0'; m.beginPath(); m.ellipse(x0 + 30, base + 10, 26, 18, 0, Math.PI, 0); m.fill(); }

    const w = 30 + R() * 50, h = 80 + R() * 150, top = base - h, x0 = mx;
    m.fillStyle = '#262c55'; m.fillRect(x0, top, w, mh - top);
    m.fillStyle = '#323a6e'; m.fillRect(x0, top, w, 3);
    for (let wy = top + 8; wy < mh - 10; wy += 9) for (let wx = x0 + 4; wx < x0 + w - 4; wx += 7) { m.fillStyle = R() < 0.35 ? '#ffd86a' : '#1a1f40'; m.fillRect(wx, wy, 3, 4); }
    if (R() < 0.3) { m.fillStyle = '#ff4a5a'; m.fillRect(x0 + w / 2, top - 10, 1, 10); m.fillRect(x0 + w / 2 - 1, top - 11, 3, 2); }
    mx += w + 4 + R() * 30;
  }

  // chão

  q.fillStyle = gBase; q.fillRect(0, 0, WW, gr.height);
  q.fillStyle = gTop; q.fillRect(0, 0, WW, 3); q.fillStyle = gLine; q.fillRect(0, 3, WW, 2);
  for (let i = 0; i < 320; i++) { q.fillStyle = R() < 0.5 ? gS1 : gS2; q.fillRect((R() * WW) | 0, (6 + R() * 30) | 0, 2 + (R() * 4 | 0), 1 + (R() * 2 | 0)); }
  if (M.road) { q.fillStyle = '#e6c23a'; for (let x = 0; x < WW; x += 34) q.fillRect(x, 20, 18, 2); }
  else { q.strokeStyle = gCrack; q.lineWidth = 1; for (let i = 0; i < 30; i++) { let x = R() * WW, yy = 6 + R() * 18; q.beginPath(); q.moveTo(x, yy); for (let k = 0; k < 4; k++) { x += (R() - 0.3) * 16; yy += R() * 5; q.lineTo(x | 0, yy | 0); } q.stroke(); } }

    x.fill();
    x.fillStyle = pTop; x.fillRect(0, 0, p.w + 8, 7); x.fillStyle = pHi; x.fillRect(0, 0, p.w + 8, 2);
    x.fillStyle = pAcc; for (let i = 0; i < p.w; i += 6) if (R() < 0.5) x.fillRect(i + 2, 0, 3, 2);
    x.fillStyle = pDot; for (let i = 0; i < 8; i++) x.fillRect(4 + R() * p.w, 9 + R() * 10, 3, 2);

  });

  for (let i = 0; i < 8; i++) {

    for (let k = 0; k < 6; k++) { cc.beginPath(); cc.arc(12 + k * 9 + R() * 4, 15 - R() * 6, 6 + R() * 5, 0, Math.PI * 2); cc.fill(); }
    L.clouds.push({ img: c, x: R() * (WW * 0.5), y: 20 + R() * 150, sp: 4 + R() * 8, par: 0.1 + R() * 0.15 });
  }

}
function drawBackground(cam, dt) {

  for (const [x, y, r, c] of M.suns) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x * VW / 480, y - cam.y * 0.05, r, 0, Math.PI * 2); ctx.fill(); }

    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 4, y - r.h); ctx.lineTo(x + r.w - 3, y - r.h + 2); ctx.lineTo(x + r.w, y); ctx.fill();

/* ---------------- HUD ---------------- */
function text(str, x, y, size, color = '#fff', align = 'left', outline = '#000', ow = 2) {
  ctx.font = FONT(size); ctx.textAlign = align; ctx.textBaseline = 'top';

  ctx.fillStyle = '#3a2e52'; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = '#20182e'; ctx.fillRect(x, y, w, h);
  if (ghost != null) { ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, Math.round(w * clamp(ghost, 0, 1)), h); }
  const ww = Math.round(w * clamp(ratio, 0, 1));
  ctx.fillStyle = dark; ctx.fillRect(x, y, ww, h); ctx.fillStyle = color; ctx.fillRect(x, y, ww, Math.ceil(h / 2));
}
function drawHUD() {
  const me = game.me; if (!me) return;
  // tudo dentro da área protegida
  const L = Math.round(SAFE.l), T = Math.round(SAFE.t), RT = Math.round(VW - SAFE.r), BT = Math.round(VH - SAFE.b);
  // faceset
  ctx.fillStyle = '#120c1c'; ctx.fillRect(L, T, 32, 32);
  ctx.fillStyle = me.pal_.swatch; ctx.fillRect(L + 1, T + 1, 30, 30);
  ctx.fillStyle = '#2a1f3d'; ctx.fillRect(L + 2, T + 2, 28, 28);
  ctx.save(); ctx.beginPath(); ctx.rect(L + 2, T + 2, 28, 28); ctx.clip();
  const face = me.dead ? me.spr.dano : me.spr.parado; ctx.drawImage(face, L + 2 + 14 - 16, T + 4 - (face._pad || 0)); ctx.restore();
  // barras de vida e energia

  const hpR = me.hp / me.maxHp, hpG = me.hpShown / me.maxHp;
  drawBar(bx, T + 2, bw, 11, hpR, hpG, hpR > 0.5 ? '#7dff6a' : hpR > 0.25 ? '#ffb02e' : '#ff4a3a', hpR > 0.5 ? '#2fbf3c' : hpR > 0.25 ? '#d8661b' : '#c4231c');
  text('HP ' + Math.ceil(me.hp), bx + 3, T + 5, 5, '#ffffff', 'left', '#120c1c', 1.2);
  const kiR = me.ki / me.maxKi;
  const fx = me.kiFullFx > 0 ? me.kiFullFx : 0;

  if (fx) text('ENERGIA MÁXIMA!', bx + bw + 6, T + 19, 5, '#ffffff', 'left', '#120c1c', 1.2);
  text('KI ' + (me.infiniteKi ? 'MAX' : Math.floor(me.ki)), bx + 3, T + 19, 5, '#ffffff', 'left', '#0b3550', 1.2);

  if (me.awakenT > 0) { ctx.font = FONT(5); text('⚡ DESPERTAR ' + Math.ceil(me.awakenT) + 's', bx + ctx.measureText(me.name).width + 8, T + 30, 5, '#ffffff', 'left', '#1b3550', 1.2); }
  const humans = game.fighters.filter(f => !f.ctrl.startsWith('ai') && !f.isBot).length;
  const footer = game.mode === 'online' ? `SALA ${net.code} · ${humans}/${MAX_PLAYERS} jogadores`
    : game.mode === 'treino' ? 'TREINO · energia infinita ' + (me.infiniteKi ? 'LIGADA' : 'DESLIGADA') : 'CONTRA BOTS';
  text(footer, bx, T + 39, 5, '#cfc6ff', 'left', '#120c1c', 1);
  if (me.hits >= 2) text(me.hits + ' HITS!', L, T + 52, 8, '#ffd23a', 'left', '#3a0d0d', 2);

  // placar (até 10 jogadores)
  const list = [...game.fighters].sort((a, b) => b.kills - a.kills || a.deaths - b.deaths).slice(0, MAX_PLAYERS);
  const pw = 104, px0 = RT - pw, bh = 12 + list.length * 8;
  ctx.fillStyle = 'rgba(18,12,28,0.72)'; ctx.fillRect(px0, T, pw, bh);
  ctx.fillStyle = '#3a2e52'; ctx.fillRect(px0, T, pw, 1);
  text('PLACAR', px0 + 4, T + 3, 5, '#ffd23a', 'left', null);
  text('K/M', RT - 4, T + 3, 5, '#8d86a8', 'right', null);
  list.forEach((f, i) => {
    const y = T + 12 + i * 8;
    ctx.fillStyle = f.pal_.swatch; ctx.fillRect(px0 + 4, y + 1, 4, 4);

    text(f.kills + '/' + f.deaths, RT - 4, y, 5, '#cfc6ff', 'right', null);
  });
  // avisos / eliminações
  let fy = T + bh + 6;

    text('DERROTADO' + (me.lastHitBy ? ' POR ' + me.lastHitBy.name.toUpperCase() : ''), VW / 2, cy + 8, 9, '#ff6a5a', 'center', '#1a0f24', 2);
    text('renascendo em ' + Math.max(1, Math.ceil(me.deadT)), VW / 2, cy + 28, 6, '#ffffff', 'center', '#1a0f24', 1);
  }

  for (const f of game.fighters) {
    if (f === me || f.dead) continue;
    const sx = f.x - game.cam.x, sy = f.y - 22 - game.cam.y;

    ctx.fillStyle = '#120c1c'; ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-5, -6); ctx.lineTo(-5, 6); ctx.fill();
    ctx.fillStyle = f.pal_.swatch; ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(-4, -4); ctx.lineTo(-4, 4); ctx.fill();
    ctx.restore();
  }
}

/* ---------------- CHAT ----------------
   • Só nas salas online. Enter (PC) ou o botão 💬 abre; Enter envia; Esc fecha.
   • Uma mensagem a cada 3 segundos, até 60 letras.
   • Filtro de palavrões nos dois lados (quem envia e quem recebe).
   • Não atrapalha a luta: as mensagens ficam pequenas no canto esquerdo e somem sozinhas,
     e aparece um balãozinho rápido sobre quem falou. */
const CHAT_COOLDOWN = 3, CHAT_MAX = 60;
let chatLog = [], chatOpen = false, chatLastSent = -99, chatRecvAt = {};
const squash = w => w.replace(/(.)\1+/g, '$1'); // "porraaa" e "poooorra" viram a mesma coisa
const BAD_EXACT = new Set(['cu', 'fdp', 'vsf', 'vsfd', 'tnc', 'vtnc', 'tmnc', 'pqp', 'krl', 'crl', 'pnc', 'kct', 'puta', 'puto', 'putas', 'putos', 'foda', 'xota', 'viado', 'viados', 'viadao', 'bicha', 'porra', 'merda', 'bosta', 'corno', 'cuzao', 'cuzinho', 'piroca', 'fudido', 'fodido', 'otario', 'otaria', 'vadia', 'vagabunda', 'vagabundo', 'fuck', 'shit', 'bitch', 'cunt', 'dick', 'pussy', 'nigga'].map(squash));
const BAD_START = ['caralh', 'buceta', 'boceta', 'arromb', 'putari', 'putinh', 'fode', 'fodas', 'fude', 'cacet', 'porra', 'merda', 'xoxot', 'punhet', 'siriric', 'viadinh', 'escrot', 'otari', 'retardad', 'vagabund', 'piranh', 'babaca', 'crioul', 'desgracad', 'cretin', 'fuck', 'motherf', 'bitch', 'piroc', 'boquet', 'xerec', 'tomanocu', 'filhodaput', 'filhadaput'].map(squash);
const BAD_INSIDE = ['caralh', 'buceta', 'boceta', 'arromb', 'filhodaput', 'filhadaput', 'punhet', 'xoxot', 'motherf', 'tomanocu'].map(squash);
function normWord(w) {
  return squash(w.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[@4]/g, 'a').replace(/3/g, 'e').replace(/[1!|]/g, 'i').replace(/0/g, 'o').replace(/[$5]/g, 's').replace(/7/g, 't')
    .replace(/[^a-z]/g, ''));
}
function isBad(n) { return !!n && (BAD_EXACT.has(n) || BAD_START.some(r => n.startsWith(r)) || BAD_INSIDE.some(r => n.includes(r))); }
function filterChat(txt) {
  txt = String(txt || '').replace(/[\u0000-\u001f<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, CHAT_MAX);
  const parts = txt.split(' ');
  // letras separadas ("p o r r a", "p.o.r.r.a") também são pegas
  for (let i = 0; i < parts.length; i++) {
    let j = i, joined = '';
    while (j < parts.length && normWord(parts[j]).length <= 1 && parts[j].length <= 2) { joined += normWord(parts[j]); j++; }
    if (j - i >= 3 && isBad(squash(joined))) { for (let k = i; k < j; k++) parts[k] = '*'; i = j - 1; continue; }
    const tokens = parts[i].split(/[.\-_,;:]+/);
    if (isBad(normWord(parts[i])) || tokens.some(t => isBad(normWord(t)))) parts[i] = '*'.repeat(Math.max(3, Math.min(8, parts[i].length)));
  }
  return parts.join(' ');
}
function openChat() {
  if (game.phase !== 'play' || game.mode !== 'online' || overlay) return;
  chatOpen = true; for (const k in keys) keys[k] = false;
  show('chatbar', true); updateTouchUI(); updateChatBtn();
  const inp = document.getElementById('chatIn'); inp.value = ''; setTimeout(() => inp.focus(), 30);
}
function closeChat() {
  chatOpen = false; const inp = document.getElementById('chatIn'); if (inp) inp.blur();
  show('chatbar', false); for (const k in keys) keys[k] = false; updateTouchUI();
}
function updateChatBtn() {
  const b = document.getElementById('chatSend'); if (!b) return;
  const left = CHAT_COOLDOWN - (game.t - chatLastSent);
  if (left > 0) { b.textContent = Math.ceil(left) + 's'; b.classList.add('wait'); } else { b.textContent = 'ENVIAR'; b.classList.remove('wait'); }
}
function sendChat() {
  const inp = document.getElementById('chatIn'), raw = inp.value.trim();
  if (!raw) { closeChat(); return; }
  if (game.t - chatLastSent < CHAT_COOLDOWN) { updateChatBtn(); inp.animate([{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], { duration: 180 }); return; }
  const txt = filterChat(raw); if (!txt) return;
  chatLastSent = game.t;
  const m = { t: 'chat', id: game.me.id, n: game.me.name, txt };
  addChat(game.me, game.me.name, txt); net.send(m);
  closeChat();
}
function receiveChat(m) {
  const f = game.byId(m.id); if (!f || f.local) return;
  const now = performance.now();
  if (chatRecvAt[m.id] && now - chatRecvAt[m.id] < (CHAT_COOLDOWN - 0.5) * 1000) return; // anti-spam também do lado de quem recebe
  chatRecvAt[m.id] = now;
  const txt = filterChat(m.txt); if (txt) addChat(f, f.name, txt);
}
function addChat(f, name, txt) {
  chatLog.push({ name, color: f ? f.pal_.swatch : '#fff', txt, life: 9 });
  if (chatLog.length > 30) chatLog.shift();
  if (f !== game.me) tone('sine', 1200, 1500, 0.06, 0.06);
}
function wrapText(str, maxW, size) {
  ctx.font = FONT(size); const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
function drawChatLog(x, y, bottom) {
  // fechado: só as últimas 4 mensagens, sumindo sozinhas. Aberto: histórico maior com fundo.
  const maxW = Math.min(170, VW * 0.36), items = chatOpen ? chatLog.slice(-8) : chatLog.filter(c => c.life > 0).slice(-4);
  if (!items.length) return;

function update(dt) {
  game.t += dt;
  if (game.phase !== 'play') return;
  if (overlay && game.mode !== 'online') return; // offline: a pausa congela o jogo
  if (game.mode === 'treino' && tap('KeyE')) game.me.infiniteKi = !game.me.infiniteKi;
  if (game.mode === 'online' && net.role === 'host') {
    if (tap('KeyB') && net.conns.length + 1 + game.bots.length < MAX_PLAYERS) game.addBot('fight', BOT_NAMES[game.bots.length % BOT_NAMES.length]);
    if (tap('KeyN')) game.removeBot();
  }
  if (hitstop > 0) { hitstop -= dt; return; }

  for (const f of game.fighters) {
    if (!f.local) { f.updateRemote(dt); continue; }
    const inp = f === game.me ? (overlay || chatOpen ? emptyInput() : humanInput()) : f.ai ? f.ai.think(dt) : emptyInput();
    f.update(dt, inp);
  }

  for (const src of game.fighters) {
    if (!src.isBeaming() || src.beamLen <= 0 || src.dead) continue;
    const r = src.beamRect();
    for (const v of game.fighters) {
      if (v === src || v.dead || (!v.local && !src.local)) continue;
      const b = v.body();
      const rr = { x0: r.x0 - (src.facing < 0 ? 0 : 14), x1: r.x1 + (src.facing > 0 ? 0 : 14) }; // inclui a mão (inimigo colado)
      if (rr.x0 < b.x1 + 4 && rr.x1 > b.x0 - 4 && r.y0 < b.y1 && r.y1 > b.y0) {
        if (v.local) v.takeBeam(dt, src);
        else if (v.invuln <= 0) v.predictBeam(dt, src); // meu raio num jogador de outro computador: mostro o dano já
      }
    }
  }
  // empurra corpos que se sobrepõem (apenas os locais se movem)
  for (const a of game.fighters) for (const b of game.fighters) {
    if (a === b || !a.local || a.dead || b.dead) continue;
    const A = a.body(), B = b.body();
    if (A.x0 < B.x1 && A.x1 > B.x0 && A.y0 < B.y1 && A.y1 > B.y0) {
      // lado decidido igual nos dois computadores (pela posição, ou pelo ID se estiverem no mesmo ponto)
      const dir = Math.abs(a.x - b.x) > 0.5 ? sign(a.x - b.x) : (a.id < b.id ? -1 : 1);
      const ov = Math.min(A.x1 - B.x0, B.x1 - A.x0) * 0.5;
      a.x = clamp(a.x + dir * Math.min(ov, 70 * dt), 14, WW - 14); // empurrão suave, sem "deslizar"

  const now = performance.now();
  game.fighters = game.fighters.filter(f => f.local || now - f.lastSeen < 25000);
  // cores repetidas no online: quem tem o ID "maior" troca de cor
  if (game.mode === 'online' && Math.random() < 0.02) for (const f of game.fighters) if (f.local && game.fighters.some(o => o !== f && o.pal === f.pal && o.id < f.id)) f.pal = freeColor(f);

  for (const p of projectiles) p.update(dt);
  updateStomps(dt); updateFreezaFx(dt); updateVegetaFx(dt); updateHitFx(dt); updateZamasuFx(dt);
  for (let i = 0; i < projectiles.length; i++) for (let j = i + 1; j < projectiles.length; j++) {

    if (a.dead || b.dead || a.o === b.o) continue;
    if (Math.hypot(a.x - b.x, a.y - b.y) < a.r + b.r + 2) { if (a.nova && !b.nova) b.explode(); else if (b.nova && !a.nova) a.explode(); else if (a.big && !b.big) b.explode(); else if (b.big && !a.big) a.explode(); else { a.explode(); b.explode(); } }

  if (particles.length > 900) particles.splice(0, particles.length - 900);

  game.cam.y = approach(game.cam.y, clamp(me.y - 160, 0, WH - VH), 5, dt);

    for (const tl of TAILS) g.appendChild(optCard(tl.name, (L.t || 0) === tl.id, partThumb({ ...L, t: tl.id }, waist), () => { L.t = tl.id; }));

  } else {

    const n = document.createElement('div'); n.className = 'cnote';
    n.textContent = 'P = cor original do personagem. + = escolher qualquer cor. A cor da aura é só do BASE; a cor do poder vale para todos os personagens.';
    P.appendChild(n);
  }
  if (!isBase) { const n = document.createElement('div'); n.className = 'cnote'; n.textContent = 'Cabelo, pele, rabo, auréola e cor da aura são do personagem BASE. Escolha o BASE para personalizar o visual.'; P.appendChild(n); }
  const pb = document.getElementById('cPoses'); pb.innerHTML = '';
  for (const [id, nm] of CUST_POSES) { const b = document.createElement('button'); b.textContent = nm; b.className = custPose === id ? 'sel' : ''; b.onclick = () => { custPose = id; buildCustomPanel(); }; pb.appendChild(b); }
}
function drawCustomPreview(t) {
  const c = document.getElementById('cPrev'), x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  x.clearRect(0, 0, c.width, c.height);
  const spr = custSprites(); if (!spr) return;
  const auto = ['parado', 'frente', 'golpe1', 'golpe2', 'golpe3', 'carga2', 'kiball', 'defesa'];
  let pose = custPose === 'auto' ? auto[Math.floor(t / 0.9) % auto.length] : custPose;
  if (custTab === 'energia' && custPose === 'auto') pose = Math.floor(t / 1.6) % 2 ? 'kiball' : 'carga2';
  const im = spr[pose] || spr.parado, pal = palForCustom(chosenChar, 0, chosenFxc);
  const fx = 40, fy = 64, sc = 1; // tamanho real do jogo (sem redesenhar nem esticar)
  const save = ctx; ctx = x; // as funções de desenho usam o ctx global
  try {
    x.save(); x.translate(fx, fy); x.scale(sc, sc);
    x.fillStyle = 'rgba(0,0,0,.35)'; x.beginPath(); x.ellipse(0, 0, 14, 3, 0, 0, Math.PI * 2); x.fill();
    if (pose === 'carga2' && !CHARS[chosenChar].ownCharge) { const fr = auraFramesFor(pal.aura); if (fr) { const a = fr[2 + (Math.floor(t / 0.08) % 2)]; x.globalAlpha = 0.9; x.drawImage(a, -a.width / 2 * AURA_SC, -a.height * AURA_SC + 3, a.width * AURA_SC, a.height * AURA_SC); x.globalAlpha = 1; } }

}
function buildCharPicker() {

function buildMenu() {

  let busy = false;
  document.getElementById('bTrain').onclick = () => { initAudio(); net.close(); game.start('treino'); };
  document.getElementById('bBots').onclick = () => { initAudio(); net.close(); game.start('bots'); };
  document.getElementById('bSettings').onclick = () => openSettings('menu');
  document.getElementById('bHost').onclick = () => {
    if (busy) return; initAudio(); if (!needNet()) return; setStatus('Criando sala...'); busy = true;
    setStatus('Criando sala (' + MAPS[chosenMap].name + ')...');
    net.hostRoom(code => { busy = false; setStatus(''); game.start('online'); killfeed.unshift({ sys: 'Sala criada! Código: ' + code, life: 12 }); net.regT = 0; },
      err => { busy = false; setStatus(err); });
  };
  const join = code => {
    if (busy) return; initAudio(); if (!needNet()) return;

/* ---------------- sem zoom, sem seleção, sem menu de toque longo ---------------- */
function lockPage() {
  // o primeiro toque em qualquer lugar já coloca em tela cheia
  document.addEventListener('pointerup', () => goFullscreen(), true);
  document.addEventListener('fullscreenchange', () => setTimeout(resizeCanvas, 150));
  const isInput = e => { const t = e.target && (e.target.nodeType === 1 ? e.target : e.target.parentElement); return !!(t && t.closest && t.closest('input')); };
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  let lastEnd = 0;
  const isCtl = e => { const t = e.target && (e.target.nodeType === 1 ? e.target : e.target.parentElement); return !!(t && t.closest && t.closest('input,button,select,label')); };
  // toque duplo em área "vazia" não dá zoom (botões já usam touch-action, então continuam respondendo rápido)
  document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastEnd < 350 && !isCtl(e)) e.preventDefault(); lastEnd = now; }, { passive: false });
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  document.addEventListener('selectstart', e => { if (!isInput(e)) e.preventDefault(); });
  document.addEventListener('contextmenu', e => { if (!isInput(e)) e.preventDefault(); });
  document.addEventListener('dragstart', e => e.preventDefault());
  addEventListener('orientationchange', () => setTimeout(resizeCanvas, 250));
  if (window.visualViewport) visualViewport.addEventListener('resize', resizeCanvas);
}

/* ---------------- botões na tela (celular e PC) ----------------
   Posição = fração da área protegida (0 a 1). Tamanho = base × tamanho geral × tamanho do botão. */
const BTN_DEFS = [
  { k: 'Stick', label: '<i class="knob"></i>', base: 24, x: .12, y: .84, stick: 1, name: 'ANALÓGICO' },
  { k: 'KeyS', label: 'DEFESA', base: 13, x: .115, y: .6, name: 'DEFESA' },
  { k: 'KeyW', label: 'PULAR', base: 17, x: .95, y: .86, name: 'PULAR' },
  { k: 'KeyJ', label: 'SOCO', base: 13, x: .8, y: .92, name: 'SOCO' },
  { k: 'KeyK', label: 'KI', base: 13, x: .8, y: .64, name: 'KI' },
  { k: 'KeyL', label: 'ESPE-<br>CIAL', base: 13, x: .95, y: .5, name: 'ESPECIAL' },
  { k: 'KeyI', label: 'RAIO', base: 13, x: .66, y: .92, name: 'RAIO' },
  { k: 'Space', label: 'CARGA', base: 13, x: .66, y: .64, name: 'CARGA' },
  { k: 'ShiftLeft', label: 'TELE-<br>PORTE', base: 13, x: .8, y: .36, name: 'TELEPORTE' },
  { k: 'Escape', label: 'MENU', base: 10, x: .5, y: .97, sq: 1, name: 'MENU' },
  { k: 'KeyE', label: '∞ KI', base: 10, x: .02, y: .34, sq: 1, name: '∞ KI', id: 'tKi' },
  { k: 'Chat', label: '💬', base: 10, x: .6, y: .03, sq: 1, name: 'CHAT', id: 'tChat' },
];
const settings = { size: 100, op: 100, btn: {} };
function loadSettings() {
  try { const o = JSON.parse(localStorage.getItem('adk_ui') || '{}'); if (o && typeof o === 'object') Object.assign(settings, o); } catch (e) {}
  if (!settings.btn || typeof settings.btn !== 'object') settings.btn = {};
}
function saveSettings() { try { localStorage.setItem('adk_ui', JSON.stringify(settings)); } catch (e) {} }
const btnEls = {};
let isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
let overlay = null, settingsBack = 'menu', editMode = false, selBtn = null;
function safeRect() { const e = document.getElementById('safe'); return { left: e.offsetLeft, top: e.offsetTop, width: e.offsetWidth, height: e.offsetHeight }; }
function layoutButtons() {
  const R = safeRect(); if (!R.width || !BTN_DEFS.length || !btnEls.Stick) return;
  for (const d of BTN_DEFS) {
    const c = settings.btn[d.k] || {}, sz = U_PX * d.base * (settings.size / 100) * (c.s || 1);
    const fx = c.x != null ? c.x : d.x, fy = c.y != null ? c.y : d.y;
    const cx = clamp(fx * R.width, sz / 2, R.width - sz / 2), cy = clamp(fy * R.height, sz / 2, R.height - sz / 2);
    const b = btnEls[d.k];
    b.style.width = b.style.height = sz + 'px';
    b.style.left = (cx - sz / 2) + 'px'; b.style.top = (cy - sz / 2) + 'px';
    b.style.fontSize = (sz * (d.arrow ? 0.42 : d.sq ? 0.2 : 0.18)) + 'px';
    if (d.stick) b.classList.add('stick');
  }
  document.getElementById('touch').style.opacity = editMode ? 1 : settings.op / 100;
}
function buildButtons() {
  const box = document.getElementById('touch'); box.innerHTML = '';
  for (const d of BTN_DEFS) {
    const b = document.createElement('button'); b.innerHTML = d.label; b.dataset.k = d.k;
    if (d.sq) b.classList.add('sm'); if (d.id) b.id = d.id;
    box.appendChild(b); btnEls[d.k] = b;
    let pid = null, drag = null;
    const down = e => {
      e.preventDefault(); initAudio(); if (actx && actx.state === 'suspended') actx.resume();
      pid = e.pointerId; try { b.setPointerCapture(pid); } catch (_) {}
      if (editMode) { // arrastar para posicionar
        selectBtn(d.k); const R = safeRect(), p = toLocal(e.clientX, e.clientY);
        drag = { dx: p.x - (R.left + b.offsetLeft + b.offsetWidth / 2), dy: p.y - (R.top + b.offsetTop + b.offsetHeight / 2) };
        show('editbar', false); return;
      }
      if (d.stick) { stickMove(b, e); return; }
      if (d.k === 'Escape') { onEscape(); return; }
      if (d.k === 'Chat') { openChat(); return; }
      if (!keys[d.k]) pressed[d.k] = true; keys[d.k] = true; b.classList.add('on');
    };
    const move = e => {
      if (d.stick && !editMode && e.pointerId === pid) { stickMove(b, e); return; }
      if (!editMode || !drag || e.pointerId !== pid) return;
      const R = safeRect(), c = settings.btn[d.k] = settings.btn[d.k] || {}, p = toLocal(e.clientX, e.clientY);
      c.x = clamp((p.x - drag.dx - R.left) / R.width, 0, 1); c.y = clamp((p.y - drag.dy - R.top) / R.height, 0, 1);

      if (pid !== null && e.pointerId !== pid) return; pid = null;
      if (drag) { drag = null; saveSettings(); placeEditbar(); return; }
      if (d.stick) { stickRelease(b); return; }
      keys[d.k] = false; b.classList.remove('on');
    };

    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);

/* analógico: arrastar para os lados anda (zona morta no meio); o botão central acompanha o dedo */
function stickMove(b, e) {
  const r = b.getBoundingClientRect(), R = r.width / 2, cx = r.left + R, cy = r.top + R;
  let dx = e.clientX - cx, dy = e.clientY - cy; const d = Math.hypot(dx, dy), lim = R * 0.62;
  if (d > lim) { dx *= lim / d; dy *= lim / d; }
  const k = b.querySelector('.knob'); if (k) k.style.transform = `translate(${dx}px,${dy}px)`;
  const dead = R * 0.22, L = dx < -dead, Rt = dx > dead;
  if (L && !keys.KeyA) pressed.KeyA = true; if (Rt && !keys.KeyD) pressed.KeyD = true;
  keys.KeyA = L; keys.KeyD = Rt; b.classList.toggle('on', L || Rt);
}
function stickRelease(b) {
  keys.KeyA = keys.KeyD = false; b.classList.remove('on');
  const k = b.querySelector('.knob'); if (k) k.style.transform = '';
}
function selectBtn(k) {
  selBtn = k; for (const d of BTN_DEFS) btnEls[d.k].classList.toggle('sel', d.k === k);
  const d = BTN_DEFS.find(d => d.k === k), s = (settings.btn[k] && settings.btn[k].s) || 1;
  document.getElementById('selName').textContent = d ? d.name + ' ' + Math.round(s * 100) + '%' : 'ARRASTE';
}
function updateTouchUI() {
  const show = editMode || (game.phase === 'play' && !overlay);
  document.getElementById('touch').classList.toggle('hidden', !show);
  document.getElementById('touch').classList.toggle('edit', editMode);
  const tk = document.getElementById('tKi'); if (tk) tk.style.display = (editMode || game.mode === 'treino') ? '' : 'none';
  const tc = document.getElementById('tChat'); if (tc) tc.style.display = (editMode || game.mode === 'online') ? '' : 'none';
  layoutButtons();
}
function show(id, on) { document.getElementById(id).classList.toggle('hidden', !on); }
function openPause() {
  if (game.phase !== 'play') return;

  document.getElementById('pauseInfo').textContent = game.mode === 'online'
    ? `sala ${net.code} · ${game.fighters.filter(f => !f.ctrl.startsWith('ai') && !f.isBot).length}/${MAX_PLAYERS} jogadores · a partida continua`
    : 'jogo pausado';
  show('pause', true); updateTouchUI();
}
function closePause() { overlay = null; show('pause', false); updateTouchUI(); }
function openSettings(from) {
  settingsBack = from; show('menu', false); show('pause', false); show('settings', true);
  if (game.phase === 'play') overlay = 'settings';
  syncSettingsUI(); updateTouchUI();
}
function closeSettings() {
  show('settings', false);
  if (settingsBack === 'menu') show('menu', true); else { overlay = 'pause'; show('pause', true); }
  updateTouchUI();
}
function syncSettingsUI() {
  document.getElementById('rSize').value = settings.size; document.getElementById('vSize').textContent = settings.size + '%';
  document.getElementById('rOp').value = settings.op; document.getElementById('vOp').textContent = settings.op + '%';
}
function startEdit() { editMode = true; show('settings', false); selectBtn(null); updateTouchUI(); placeEditbar(); }
/* procura um lugar livre (sem botão) para a barrinha da edição */
function placeEditbar() {
  if (!editMode) return;
  const eb = document.getElementById('editbar'); show('editbar', true);
  const R = safeRect(), w = eb.offsetWidth, h = eb.offsetHeight;
  const rects = BTN_DEFS.map(d => { const b = btnEls[d.k]; return { x0: b.offsetLeft - 6, y0: b.offsetTop - 6, x1: b.offsetLeft + b.offsetWidth + 6, y1: b.offsetTop + b.offsetHeight + 6 }; });
  const free = (x, y) => !rects.some(r => x < r.x1 && x + w > r.x0 && y < r.y1 && y + h > r.y0);
  const cands = [];
  for (const fy of [0, 0.5, 1, 0.25, 0.75]) for (const fx of [0.5, 0.3, 0.7, 0.15, 0.85, 0, 1]) cands.push([fx * (R.width - w), fy * (R.height - h)]);
  let pos = cands.find(([x, y]) => free(x, y));
  if (!pos) { // tudo ocupado: procura numa grade fina
    for (let y = 0; y <= R.height - h && !pos; y += 8) for (let x = 0; x <= R.width - w && !pos; x += 8) if (free(x, y)) pos = [x, y];
  }
  pos = pos || [(R.width - w) / 2, 0];
  eb.style.left = Math.round(pos[0]) + 'px'; eb.style.top = Math.round(pos[1]) + 'px';
}
function finishEdit() { editMode = false; selectBtn(null); saveSettings(); show('editbar', false); show('settings', true); updateTouchUI(); }
function onEscape() {
  if (chatOpen) closeChat();
  else if (editMode) finishEdit();
  else if (!document.getElementById('settings').classList.contains('hidden')) closeSettings();
  else if (game.phase === 'play') { if (overlay === 'pause') closePause(); else openPause(); }
}
function setupTouch() {
  loadSettings(); buildButtons();
  document.getElementById('rSize').addEventListener('input', e => { settings.size = +e.target.value; syncSettingsUI(); layoutButtons(); saveSettings(); });
  document.getElementById('rOp').addEventListener('input', e => { settings.op = +e.target.value; syncSettingsUI(); layoutButtons(); saveSettings(); });
  document.getElementById('bEdit').onclick = startEdit;
  document.getElementById('bReset').onclick = () => { settings.size = 100; settings.op = 100; settings.btn = {}; saveSettings(); syncSettingsUI(); layoutButtons(); };
  document.getElementById('bBack').onclick = closeSettings;
  document.getElementById('eDone').onclick = finishEdit;
  document.getElementById('eReset').onclick = () => { settings.btn = {}; saveSettings(); selectBtn(null); layoutButtons(); placeEditbar(); };
  const resize = f => { if (!selBtn) return; const c = settings.btn[selBtn] = settings.btn[selBtn] || {}; c.s = clamp(Math.round(((c.s || 1) + f) * 10) / 10, 0.6, 1.8); selectBtn(selBtn); layoutButtons(); saveSettings(); placeEditbar(); };
  document.getElementById('eMinus').onclick = () => resize(-0.1);
  document.getElementById('ePlus').onclick = () => resize(0.1);
  document.getElementById('pContinue').onclick = closePause;
  document.getElementById('pSettings').onclick = () => openSettings('pause');
  document.getElementById('pExit').onclick = () => game.toMenu();
  addEventListener('touchstart', () => { isTouch = true; }, { passive: true });
}

/* ---------------- loop ---------------- */
let last = performance.now(), acc = 0; const STEP = 1 / 60;
function advance(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
  while (acc >= STEP) { update(STEP); acc -= STEP; for (const k in pressed) delete pressed[k]; }
  return dt;
}
function frame(now) {
  const dt = advance(now);
  if (!document.hidden) render(dt);
  requestAnimationFrame(frame);
}
/* Com a aba em segundo plano o navegador para o requestAnimationFrame.
   Um "relógio" num Worker mantém o jogo e a rede rodando, então o personagem não sai da sala. */
(function keepAlive() {
  const tick = () => { if (document.hidden) advance(performance.now()); };
  try {
    const w = new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(0)},50)'], { type: 'text/javascript' })));
    w.onmessage = tick;
  } catch (e) { setInterval(tick, 50); }
  document.addEventListener('visibilitychange', () => { last = performance.now(); acc = 0; for (const k in keys) keys[k] = false; });
})();
buildBackground(); buildMenu(); setupTouch(); lockPage(); setupChat();
resizeCanvas(); addEventListener('resize', resizeCanvas); setTimeout(resizeCanvas, 300);
addEventListener('pagehide', () => { if (game.phase === 'play') net.leave(true); lobby.stop(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
loadSprites().then(() => { buildAuras(); buildCharPicker(); buildMapPicker(); document.getElementById('bCustom').onclick = openCustom; document.getElementById('cDone').onclick = closeCustom;
  document.getElementById('cRand').onclick = () => { // visual sorteado
    const pick = a => a[(Math.random() * a.length) | 0];
    if (chosenChar === 'base') chosenLook = randomLook();
    chosenFxc = { a: pick([''].concat(FX_COLORS)), k: pick([''].concat(FX_COLORS)) }; saveLook();
  }; if (game.phase === 'loading') game.phase = 'menu'; updateTouchUI(); lobby.start(); }).catch(e => console.error(e));
requestAnimationFrame(frame);
</script>
